# Eval questions (Docs/eval.md §2.1). Phase 1 starts the set with factual questions, one per
# gold fact in tests/gold_facts.yaml, plus phrasing variants (former names, typos, Hinglish).
# Phase 3 adds advisory, performance, nav, multi_scheme, greeting, out_of_scope, clarification,
# pii, looks_advisory and mixed questions (run with `python -m tests.pipeline_eval`). For those,
# expected.template is the reply kind (or list of acceptable kinds); null means a factual answer.
#
# status: deferred means the fact type is out of scope for now (riskometer, Decisions Log #22);
# the runner skips these.
# status: pending_source means the gold value isn't available until the matching scheme or
# statement page is saved manually (fetch: manual in sources.yaml); the runner skips these.
#
# source_docs lists acceptable cited source types, preferred first.

