general:
  # Combined monthly factsheet: expense ratio and minimum amounts for all schemes, and the
  # only monthly source for HDFC Silver ETF Fund of Fund.
  - id: hdfc-factsheet
    type: factsheet
    title: HDFC MF Factsheet - September 2026
    url: https://files.hdfcfund.com/s3fs-public/2026-10/HDFC%20MF%20Factsheet%20-%20September%202026.pdf?VersionId=xjdQxQp4UEchOirw4TsCE9jEGenOREzw
    fetch: auto
    multi_scheme: true

  # Statement of Additional Information: covers all schemes. Source for minimum SIP amounts
  # (Rs. 100 for all schemes except ELSS, Rs. 500 for ELSS) and statement/CAS rules.
  - id: hdfc-sai
    type: sai
    title: HDFC MF - Statement of Additional Information (SAI)
    url: https://files.hdfcfund.com/s3fs-public/2026-10/SAI%20with%20updated%20Addendum%20dated%20September%2030%2C%202026_0.pdf?VersionId=lfGf17WvPBngQbX0cgJI7tzWW_z3AcG0
