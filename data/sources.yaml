# Source registry: the only documents the assistant may ingest and cite.
# See architecture.md §3.1. Every URL below is an official HDFC Mutual Fund, AMFI, or SEBI URL.
# Groww URLs appear only as `groww_reference` (product context) and are never fetched or cited.
#
# Last verified: 2026-10-27
#
# Fields per source:
#   type   scheme_page | sid | kim | fund_facts | factsheet | sai | amfi_education | sebi_education
#          | amc_service | investor_safety | nav_feed
#   url    citation link shown to users
#   fetch  auto   - downloaded by the ingestion pipeline
#          manual - host blocks automated downloads (www.hdfcfund.com returns 403); a person saves
#                   the page from a browser into data/raw/manual/<id>.html before ingesting
#          none   - citation link only, never ingested
#   Scheme pages are `none` (citation links only). They are the only text source for the
#   riskometer level (every PDF shows it as an image); riskometer answers are deferred
#   (Decisions Log #22). To enable them later, set these to `manual` and save the pages.
#   amfi_code  (schemes) AMFI scheme code of the Direct Plan - Growth Option, used to look up the
#              latest NAV in the nav_feed file at question time (app/nav.py); never ingested
#   multi_scheme  true when one document covers many schemes; the chunker keeps only the
#                 sections for schemes in this registry and tags each chunk with its scheme_id
#
# Monthly documents (fund_facts, factsheet) move to a new URL each month. Update them when
# HDFC publishes the next month's files (scheme pages link to the current Fund Facts; the
# combined factsheet is listed at https://www.hdfcfund.com/mutual-funds/factsheets).

